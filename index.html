const $ = s => document.querySelector(s);
const out = $("#out"), screen = $("#screen"), input = $("#cmd"), typed = $("#typed"), promptEl = $("#prompt");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let skip = false, busy = true;
const hist = []; let hIdx = 0;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const span = (cls, t) => `<span class="${cls}">${esc(t)}</span>`;
const cmdLink = (c, label = c) => `<span class="cmd" data-cmd="${esc(c)}" role="button" tabindex="0">${esc(label)}</span>`;
const sleep = ms => (skip || reduced) ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
const PS1 = `<span class="ps1">visitor@caner<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></span>`;

function scrollDown() { screen.scrollTop = screen.scrollHeight; }
function line(html = "", cls = "") {
  const d = document.createElement("div");
  d.className = "line" + (cls ? " " + cls : "");
  d.innerHTML = html;
  out.appendChild(d);
  scrollDown();
  return d;
}
async function print(lines, delay = 28) {
  for (const l of lines) {
    if (Array.isArray(l)) line(l[0], l[1]); else line(l);
    await sleep(delay);
  }
}
async function typeText(el, text, speed = 22) {
  for (let i = 0; i < text.length; i++) {
    if (skip || reduced) { el.textContent = text; break; }
    el.textContent = text.slice(0, i + 1);
    scrollDown();
    await sleep(speed + (Math.random() * speed * .8));
  }
}

const fmt = s => { if (!s) return "Present"; const [y, m] = ym(s); return `${MONTHS[m - 1]} ${y}`; };
function dur(a, b) {
  const [y1, m1] = ym(a), [y2, m2] = ym(b);
  const t = (y2 - y1) * 12 + (m2 - m1) + 1, y = Math.floor(t / 12), m = t % 12;
  return [y && `${y}y`, m && `${m}m`].filter(Boolean).join(" ");
}
function durLong(a, b) {
  const [y1, m1] = ym(a), [y2, m2] = ym(b);
  const t = (y2 - y1) * 12 + (m2 - m1) + 1, y = Math.floor(t / 12), m = t % 12;
  return `${y} years, ${m} months`;
}

const FONT = {

  A: ["    _    ", "   / \\   ", "  / _ \\  ", " / ___ \\ ", "/_/   \\_\\"],

  U: [" _   _ ", "| | | |", "| | | |", "| |_| |", " \\___/ "],
  M: [" __  __ ", "|  \\/  |", "| |\\/| |", "| |  | |", "|_|  |_|"],
  S: [" ____  ", "/ ___| ", "\\___ \\ ", " ___) |", "|____/ "],
};
function figlet(word) {
  const rows = ["", "", "", "", ""];
  for (const ch of word) {
    const r = FONT[ch], w = Math.max(...r.map(x => x.length));
    r.forEach((x, i) => rows[i] += x.padEnd(w));
  }
  return rows;
}
function bannerHTML() {
  const a = figlet("CANER"), b = figlet("GUMUS");
  const charW = 0.6, avail = out.clientWidth || 600;
  const wide = a.map((r, i) => r + "   " + b[i]);
  const cols = wide[0].length;
  let rows, size;
  const fitWide = avail / (cols * charW);
  if (fitWide >= 9) { rows = wide; size = Math.min(15, fitWide); }
  else { rows = [...a, ...b]; size = Math.min(15, avail / (a[0].length * charW)); }
  return `<div class="ascii banner" style="font-size:${size.toFixed(1)}px">${esc(rows.join("\n"))}</div>`;
}

const ALIASES = {
  "?": "help", h: "help", commands: "help",
  "about-me": "about", bio: "about", summary: "about", info: "about",
  exp: "experience", work: "experience", jobs: "experience", career: "experience",
  skill: "skills", stack: "skills",
  edu: "education", school: "education",
  cert: "certs", certifications: "certs", awards: "certs",
  email: "contact", mail: "contact", linkedin: "contact", hire: "contact",
  cv: "resume", plain: "resume", print: "resume", pdf: "resume",
  cls: "clear", hi: "hello", hey: "hello", "hello!": "hello",
  emacs: "vim", nano: "vim", ":q": "vim", logout: "exit", quit: "exit",
  fetch: "neofetch", tea: "coffee", ".secrets": "secrets",
  travel: "fly", flight: "fly", plane: "fly", vacation: "fly", "boarding-pass": "fly",
};
const VISIBLE = HELP.map(h => h[0]);
const ALL = [...Object.keys(COMMANDS), ...Object.keys(ALIASES)];

function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

async function run(raw) {
  const text = raw.trim();
  line(`${PS1} ${span("bright", raw)}`);
  if (!text) return;
  hist.push(text); hIdx = hist.length;
  const [name, ...args] = text.split(/\s+/);
  let key = name.toLowerCase();
  if (key === "sudo" && args[0] && args[0].toLowerCase() === "rm") key = "rm";
  key = ALIASES[key] || key;
  const fn = COMMANDS[key];
  busy = true; skip = false; promptEl.classList.add("waiting");
  try {
    if (fn) await fn(args, text);
    else {
      const guess = [...VISIBLE, ...Object.keys(COMMANDS)].map(c => [c, lev(key, c)]).sort((a, b) => a[1] - b[1])[0];
      line(`${span("err", "zsh: command not found:")} ${esc(name)}`);
      if (guess && guess[1] <= 2) line(`Did you mean ${cmdLink(guess[0])}?`);
      else line(`Type ${cmdLink("help")} to see what's available.`);
    }
  } catch (e) {
    line(span("err", "segfault (core dumped): " + e.message));
  } finally {
    if (key !== "clear") line("");
    busy = false; skip = false;
    promptEl.classList.remove("waiting");
    renderPrompt(); scrollDown();
  }
}

/* ---------- input handling ---------- */
input.addEventListener("keydown", e => {
  if (busy) return;
  if (e.key === "Enter") {
    e.preventDefault();
    const v = input.value; input.value = ""; renderPrompt(); run(v);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (hIdx > 0) { hIdx--; input.value = hist[hIdx]; }
    requestAnimationFrame(() => { input.setSelectionRange(input.value.length, input.value.length); renderPrompt(); });
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (hIdx < hist.length - 1) { hIdx++; input.value = hist[hIdx]; } else { hIdx = hist.length; input.value = ""; }
    renderPrompt();
  } else if (e.key === "Tab") {
    e.preventDefault();
    const v = input.value.toLowerCase();
    if (!v) return;
    if (v.startsWith("theme ")) {
      const p = v.slice(6), m = THEMES.filter(t => t.startsWith(p));
      if (m.length === 1) input.value = "theme " + m[0];
      renderPrompt(); return;
    }
    const pool = [...new Set([...VISIBLE, ...Object.keys(COMMANDS)])];
    const m = pool.filter(c => c.startsWith(v));
    if (m.length === 1) input.value = m[0] + " ";
    else if (m.length > 1) {
      let pre = m[0];
      for (const x of m) while (!x.startsWith(pre)) pre = pre.slice(0, -1);
      if (pre.length > v.length) input.value = pre;
      else { line(`${PS1} ${esc(input.value)}`); line(m.map(x => cmdLink(x)).join("   ")); }
    }
    renderPrompt();
  } else if (e.ctrlKey && e.key.toLowerCase() === "l") {
    e.preventDefault(); out.innerHTML = "";
  } else if (e.ctrlKey && e.key.toLowerCase() === "c") {
    e.preventDefault(); line(`${PS1} ${esc(input.value)}^C`); input.value = ""; renderPrompt();
  }
});
document.addEventListener("keydown", e => {
  if ($("#plain").classList.contains("open")) { if (e.key === "Escape") closePlain(); return; }
  if (e.target === input && e.key === "Enter") return; // the Enter that starts a command must not skip it
  if (busy) { skip = true; if (e.key === " " || e.key === "Enter") e.preventDefault(); return; }
  if (document.activeElement !== input && !e.metaKey && !e.ctrlKey && !e.altKey && document.activeElement?.tagName !== "BUTTON") focusInput();
});
screen.addEventListener("click", e => {
  const c = e.target.closest("[data-cmd]");
  if (c) { if (!busy) autoRun(c.dataset.cmd); return; }
  if (busy) { skip = true; return; }
  if (e.target.closest("a")) return;
  if (!String(getSelection())) focusInput();
});
screen.addEventListener("keydown", e => {
  const c = e.target.closest?.("[data-cmd]");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (!busy) autoRun(c.dataset.cmd); }
});

async function autoRun(cmd) {
  if (busy) return;
  busy = true;
  input.value = "";
  for (const ch of cmd) { input.value += ch; renderPrompt(); await sleep(38); }
  await sleep(120);
  busy = false;
  const v = input.value; input.value = ""; renderPrompt();
  await run(v);
  focusInput();
}

function runMatrix() {
  return new Promise(resolve => {
    const cv = $("#matrix"), ctx = cv.getContext("2d");
    cv.style.display = "block";
    const fs = 16;
    const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
    resize();
    let drops = Array(Math.ceil(cv.width / fs)).fill(0).map(() => Math.random() * -50);
    const chars = "アカサタナハマヤラワ0123456789CANERGUMUSPRODUCTAI<>/{}=+*".split("");
    const color = getComputedStyle(document.documentElement).getPropertyValue("--fg").trim() || "#39ff7a";
    let raf, t0 = performance.now(), last = 0;
    const msg = "PRODUCT · AI · DATA";
    function frame(t) {
      if (t - last > 45) {
        last = t;
        ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.font = `${fs}px JetBrains Mono, monospace`;
        drops.forEach((y, i) => {
          ctx.fillStyle = Math.random() > .975 ? "#fff" : color;
          ctx.fillText(chars[(Math.random() * chars.length) | 0], i * fs, y * fs);
          drops[i] = y * fs > cv.height && Math.random() > .975 ? 0 : y + 1;
        });
        if (t - t0 > 2500) {
          ctx.font = `bold ${Math.min(48, innerWidth / 14)}px JetBrains Mono, monospace`;
          ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.shadowColor = color; ctx.shadowBlur = 20;
          ctx.fillText(msg, cv.width / 2, cv.height / 2);
          ctx.shadowBlur = 0; ctx.textAlign = "start";
        }
      }
      if (skip || t - t0 > 9000) return stop();
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      cancelAnimationFrame(raf);
      cv.style.display = "none"; ctx.clearRect(0, 0, cv.width, cv.height);
      cv.removeEventListener("click", onClick); removeEventListener("resize", resize);
      resolve();
    }
    const onClick = () => { skip = true; };
    cv.addEventListener("click", onClick);
    addEventListener("resize", resize);
    if (reduced) { setTimeout(stop, 1200); } else raf = requestAnimationFrame(frame);
  });
}

/* ---------- confetti ---------- */
function confetti() {
  if (reduced) return;
  const glyphs = ["*", "+", "✦", "★", "$", "#", "@", "%", "✓", "♥"];
  const colors = ["#39ff7a", "#ffd166", "#5fd7ff", "#ff79c6", "#ff5f6d", "#ffffff"];
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = glyphs[(Math.random() * glyphs.length) | 0];
    s.style.left = Math.random() * 100 + "vw";
    s.style.color = colors[(Math.random() * colors.length) | 0];
    s.style.fontSize = 12 + Math.random() * 18 + "px";
    s.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    s.style.animationDuration = 1.8 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4500);
  }
}

/* ---------- plain view ---------- */
function buildPlain() {
  const e = esc;
  return `<div class="wrap">
    <div class="bar"><button type="button" onclick="window.print()">Print / Save PDF</button><button type="button" onclick="closePlain()">← Back to terminal</button></div>
    <h1>${e(DATA.name)}</h1>
    <p class="sub">${e(DATA.title)} · ${e(DATA.tagline)}</p>
    <p class="sub">${e(DATA.location)}</p>
    <p class="contact"><a href="mailto:${e(DATA.email)}">${e(DATA.email)}</a> · <a href="${e(DATA.linkedin)}" target="_blank" rel="noopener">${e(DATA.linkedin.replace("https://www.", ""))}</a></p>
    <h2>Summary</h2>${DATA.summary.map(p => `<p>${e(p)}</p>`).join("")}
    <h2>Experience</h2>
    ${DATA.experience.map(j => `<div class="job">
      <div class="job-h"><b>${e(j.role)} · ${e(j.company)}</b><span class="when">${fmt(j.start)} – ${fmt(j.end)} · ${dur(j.start, j.end)}</span></div>
      ${j.note ? `<p style="color:#6b685f;font-size:14px">${e(j.note)}</p>` : ""}
      <ul>${j.points.map(p => `<li>${e(p)}</li>`).join("")}</ul></div>`).join("")}
    <h2>Education</h2>
    ${DATA.education.map(ed => `<div class="job"><div class="job-h"><b>${e(ed.degree)}</b><span class="when">${e(ed.years)}</span></div><div>${e(ed.school)}</div></div>`).join("")}
    <h2>Certifications & Awards</h2>
    <ul>${[...DATA.certs, ...DATA.awards].map(c => `<li>${e(c)}</li>`).join("")}</ul>
    <h2>Skills</h2><p>${[...DATA.skills.map(s => s[0]), ...DATA.tags].map(e).join(" · ")}</p>
    <h2>Languages</h2><p>${DATA.languages.map(e).join(", ")}</p>
  </div>`;
}
function openPlain() { const p = $("#plain"); p.innerHTML = buildPlain(); p.classList.add("open"); p.scrollTop = 0; }
function closePlain() { $("#plain").classList.remove("open"); focusInput(); }
$("#plainBtn").addEventListener("click", openPlain);

/* =====================================================================
   BOOT SEQUENCE
   ===================================================================== */
async function boot() {
  const skipBoot = () => { skip = true; };
  addEventListener("click", skipBoot); addEventListener("touchstart", skipBoot, { passive: true });

  const dots = (label, status = "OK", w = 44) => `${esc(label)} ${span("dim", ".".repeat(Math.max(3, w - label.length)))} ${span("ok", status)}`;
  if (!reduced) {
    await print([
      span("bright", "CG-BIOS v15.0  (c) 2005–" + now.getFullYear() + " Caner Gümüş Systems"),
      span("dim", "Press any key to skip"),
      "",
    ], 120);
    const mem = line("Memory test: ");
    for (let k = 0; k <= 640; k += 64) { mem.innerHTML = `Memory test: ${k}K roadmaps`; await sleep(35); }
    mem.innerHTML += " " + span("ok", "OK");
    await print([
      dots("CPU: Product Brain @ 15+ yrs"),
      dots("Detecting coffee", "FOUND"),
      dots("Loading modules: genai agentic-ai data ux"),
      dots("Mounting /career"),
      dots("Connecting stakeholders", "ALIGNED"),
      dots("Starting resume daemon"),
    ], 170);
    await sleep(500);
    out.innerHTML = "";
  }

  line(bannerHTML());
  await sleep(150);
  const t1 = line("", "bright");
  await typeText(t1, `${DATA.name} — ${DATA.title}`, 28);
  const t2 = line("", "dim");
  await typeText(t2, `${DATA.tagline} · ${DATA.location}`, 12);
  line("");
  line(`Welcome! This is an interactive terminal. Type ${cmdLink("help")} or tap a command below.`);
  line(`${span("dim", "Just want the facts?")} ${cmdLink("resume", "open the plain resume")}`);
  line("");

  removeEventListener("click", skipBoot); removeEventListener("touchstart", skipBoot);
  busy = false; skip = false;
  promptEl.classList.remove("waiting");
  renderPrompt();
  if (matchMedia("(hover: hover)").matches) focusInput();

  if (new URLSearchParams(location.search).has("plain")) openPlain();
}

let resizeT;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
  const b = out.querySelector(".banner"); if (b) b.outerHTML = bannerHTML();
}, 150); });

document.fonts?.ready.then(boot) ?? boot();
